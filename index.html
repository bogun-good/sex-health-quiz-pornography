<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음란물과 성 건강 퀵즈</title>
<style>
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    max-width: 700px;
    width: 100%;
    padding: 30px;
    text-align: center;
  }
  h1 { color: #4a148c; margin-bottom: 10px; }
  .subtitle { color: #666; margin-bottom: 30px; }
  .question {
    font-size: 1.2em;
    margin: 20px 0;
    line-height: 1.6;
    color: #333;
  }
  .options { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
  .option {
    background: #f5f5f5;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-size: 1em;
  }
  .option:hover { background: #e3f2fd; border-color: #2196f3; }
  .option.selected { background: #e8f5e9; border-color: #4caf50; }
  .option.correct { background: #c8e6c9; border-color: #388e3c; }
  .option.wrong { background: #ffcdd2; border-color: #d32f2f; }
  .btn {
    background: #4a148c;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 1.1em;
    cursor: pointer;
    margin: 10px;
    transition: background 0.2s;
  }
  .btn:hover { background: #6a1b9a; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .progress { margin: 15px 0; font-weight: bold; color: #4a148c; }
  .result { font-size: 1.5em; margin: 20px 0; color: #2e7d32; }
  .explanation {
    background: #fff3e0;
    border-left: 4px solid #ff9800;
    padding: 15px;
    margin: 15px 0;
    text-align: left;
    border-radius: 8px;
    display: none;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>📚 음란물과 성 건강 퀵즈</h1>
  <p class="subtitle">학습목표: 음란물의 해로움을 말할 수 있다. 음란물에 대처할 수 있다.</p>
  <div id="quiz"></div>
  <div class="progress" id="progress"></div>
  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>다음 문제</button>
  <button class="btn hidden" id="restartBtn" onclick="restart()">다시 풀기</button>
  <div id="finalResult" class="hidden"></div>
</div>

<script>
const questions = [
  {
    q: "음란물이란 무엇인가요?",
    options: [
      "친구들과 재미있게 보는 만화",
      "돈을 벌 목적으로 성적 흥분을 일으키도록 만든 사진, 동영상, 만화 등",
      "건강한 성교육을 위한 자료",
      "운동이나 취미 활동에 대한 영상"
    ],
    answer: 1,
    exp: "음란물은 돈을 벌기 위해 성적 흥분을 일으키도록 만든 자료를 말합니다. 정상적인 성 윤리를 해칠 수 있어요."
  },
  {
    q: "음란물 중독의 4단계를 올바른 순서로 고르세요.",
    options: [
      "① 강한 호기심 → ② 더 자극적인 것 찾기 → ③ 일반 사람들이 한다고 생각 → ④ 따라 해 보려고 함",
      "① 따라 해 보기 → ② 호기심 → ③ 자극적인 것 찾기 → ④ 일반적이라고 생각",
      "① 일반적이라고 생각 → ② 호기심 → ③ 따라 해 보기 → ④ 자극적인 것 찾기",
      "① 더 자극적인 것 찾기 → ② 강한 호기심 → ③ 따라 해 보기 → ④ 일반적이라고 생각"
    ],
    answer: 0,
    exp: "1단계: 놀라기도 하지만 강한 호기심이 생긴다. 2단계: 더 자극적인 것을 찾는다. 3단계: 일반 사람들이 이렇게 한다고 생각한다. 4단계: 실제로 따라 해 보려고 방법을 찾는다."
  },
  {
    q: "독일 뒤스부르크대 연구에 따르면, 음란물를 많이 본 그룹의 기억력은 어떻게 되었나요?",
    options: [
      "기억력이 20% 좋아졌다",
      "기억력이 13% 떨어졌다",
      "기억력에 변화가 없었다",
      "집중력이 크게 향상되었다"
    ],
    answer: 1,
    exp: "음란물를 많이 시청한 그룹이 그렇지 않은 그룹보다 기억력이 13% 떨어졌습니다. 대뇌 피질이 줄어드는 영향이 있어요."
  },
  {
    q: "음란물에 중독되면 나타날 수 있는 증상으로 옳지 않은 것은?",
    options: [
      "낮 동안 졸리고 피곤하다",
      "집중력이 약해져 학습 능력이 떨어진다",
      "친구와 놀거나 운동하는 즐거움이 커진다",
      "음란물 보는 행동을 숨기며 우울해지기도 한다"
    ],
    answer: 2,
    exp: "중독되면 다른 활동에서 즐거움을 느끼지 못하고, 낮에 피곤하며 집중력이 떨어집니다. 운동이나 취미로 건강한 생활로 바꾸는 것이 중요해요."
  },
  {
    q: "음란물의 특징으로 알맞은 것은?",
    options: [
      "사랑, 결혼, 생명에 대한 책임을 자세히 다룬다",
      "사람의 몸을 성적인 대상으로만 보여주는 경우가 많다",
      "실제와 똑같은 성의 모습만 나온다",
      "돈을 벌기 위한 목적이 아니다"
    ],
    answer: 1,
    exp: "음란물은 사람의 몸을 성적 대상으로만 보여주고, 사랑·결혼·책임 같은 가치는 다루지 않으며, 과장되거나 실제와 다른 모습이 자주 나옵니다."
  },
  {
    q: "음란물의 해로움: 사람의 몸을 (　　)하지 못하게 된다. 빈칸에 들어갈 말은?",
    options: [
      "무시",
      "존중",
      "즐김",
      "숨김"
    ],
    answer: 1,
    exp: "음란물은 사람의 몸을 존중하지 못하게 만들고, 잘못된 성 가치관을 형성할 수 있습니다."
  },
  {
    q: "음란물로 인해 생길 수 있는 잘못된 성 가치관은 무엇 중심인가요?",
    options: [
      "사랑 중심",
      "책임 중심",
      "쾌락 중심",
      "결혼 중심"
    ],
    answer: 2,
    exp: "(쾌락) 중심의 잘못된 성 가치관이 생길 수 있고, 어른이 되어 정상적인 결혼생활이 어렵게 될 수 있습니다."
  },
  {
    q: "음란물에 대처하는 올바른 방법으로 알맞은 것은?",
    options: [
      "처음부터 보지 않기로 결심한다",
      "불법 영상 링크를 눌러 확인한다",
      "밤늦게 혼자 인터넷을 오래 한다",
      "친구에게 음란물를 추천한다"
    ],
    answer: 0,
    exp: "처음부터 보지 않기로 결심하고, 불법 영상이나 링크는 누르지 않으며, 여러 사람이 있는 공간에서 정한 시간만 사용하세요."
  },
  {
    q: "음란물 대신 하면 좋은 활동으로 적절한 것은?",
    options: [
      "밤늦게 스마트폰만 보기",
      "운동이나 취미 활동하기",
      "불법 영상을 더 찾아보기",
      "혼자 방에서 오래 인터넷 하기"
    ],
    answer: 1,
    exp: "음란물 대신 즐겁게 할 수 있는 운동이나 취미 활동을 하여 건강한 방향으로 생활 태도를 바꾸는 것이 중요합니다."
  },
  {
    q: "다음 중 음란물에 올바르게 대처하는 방법이 아닌 것은?",
    options: [
      "불법 영상이나 링크 주소는 누르지 않는다",
      "인터넷을 여러 사람이 있는 공간에서 정한 시간 동안만 사용한다",
      "음란물를 보면 더 자극적인 것을 찾아본다",
      "처음부터 보지 않기로 결심한다"
    ],
    answer: 2,
    exp: "더 자극적인 것을 찾는 것은 중독의 단계입니다. 결심하고, 링크를 누르지 않으며, 사용 시간과 장소를 조절하세요."
  }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('progress').textContent = `문제 ${current + 1} / ${questions.length}`;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('quiz').innerHTML = `
    <div class="question">${q.q}</div>
    <div class="options" id="options"></div>
    <div class="explanation" id="exp"></div>
  `;
  const optionsDiv = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectOption(i);
    optionsDiv.appendChild(div);
  });
}

function selectOption(index) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const options = document.querySelectorAll('.option');
  options.forEach((opt, i) => {
    opt.onclick = null;
    if (i === q.answer) opt.classList.add('correct');
    if (i === index && i !== q.answer) opt.classList.add('wrong');
    if (i === index) opt.classList.add('selected');
  });
  if (index === q.answer) score++;
  document.getElementById('exp').innerHTML = '<strong>설명:</strong> ' + q.exp;
  document.getElementById('exp').style.display = 'block';
  document.getElementById('nextBtn').disabled = false;
  if (current === questions.length - 1) {
    document.getElementById('nextBtn').textContent = '결과 보기';
  }
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('progress').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('restartBtn').classList.remove('hidden');
  const percent = Math.round((score / questions.length) * 100);
  let msg = '';
  if (percent >= 90) msg = '🎉 훌륭해요! 음란물의 해로움과 대처 방법을 잘 알고 있어요!';
  else if (percent >= 70) msg = '👍 잘했어요! 조금 더 연습하면 완벽해질 거예요.';
  else msg = '💪 다시 한번 공부하고 도전해 보세요. 건강한 성 가치관이 중요해요!';
  document.getElementById('finalResult').innerHTML = `
    <div class="result">점수: ${score} / ${questions.length} (${percent}점)</div>
    <p>${msg}</p>
    <p style="margin-top:20px; color:#555;">음란물의 위험성을 알고 건강하게 대처하는 연습을 해 보세요. 💪</p>
  `;
  document.getElementById('finalResult').classList.remove('hidden');
}

function restart() {
  current = 0;
  score = 0;
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('progress').classList.remove('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').textContent = '다음 문제';
  document.getElementById('restartBtn').classList.add('hidden');
  document.getElementById('finalResult').classList.add('hidden');
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
